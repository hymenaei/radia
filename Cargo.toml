[workspace]
resolver = "3"
members = [
    "apps/viewer",
    "crates/cvars",
    "crates/llsd",
    "crates/math",
    "crates/utils",
    "crates/test-support",
    "crates/network",
    "crates/protocol",
    "crates/world",
    "crates/render",
    "crates/storage",
    "crates/assets",
    "crates/inventory",
]
default-members = ["apps/viewer"]

[workspace.package]
edition = "2024"
version = "0.0.1"
license = "LGPL-2.1-only"

[workspace.dependencies]
assets = { path = "crates/assets" }
cvars = { path = "crates/cvars" }
inventory = { path = "crates/inventory" }
imbl = { version = "7.0.2", default-features = false }
llsd = { path = "crates/llsd" }
math = { path = "crates/math" }
network = { path = "crates/network" }
protocol = { path = "crates/protocol" }
render = { path = "crates/render" }
storage = { path = "crates/storage" }
test-support = { path = "crates/test-support" }
utils = { path = "crates/utils" }
world = { path = "crates/world" }

axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio"] }
base64 = { version = "=0.23.1", default-features = false, features = ["std"] }
block_compression = { version = "=0.11.0", default-features = false }
divan = { package = "codspeed-divan-compat", version = "6.0.0" }
dirs = "=7.0.0"
dxr = "=0.9.0"
flate2 = "=1.1.11"
futures = "0.3"
rusqlite = { version = "=0.43.0", default-features = false, features = [
    "bundled",
] }
glam = "0.34.1"
prism = { package = "gpui-kit", git = "https://github.com/chloridian/prism" }
prism-test-support = { package = "gpui-ce", git = "https://github.com/chloridian/prism", features = ["test-support"] }
prism-tokio = { package = "gpui_ce_tokio", git = "https://github.com/chloridian/prism" }
prism-wgpu = { package = "gpui_ce_wgpu", git = "https://github.com/chloridian/prism" }
hecs = "0.11"
httpdate = "=1.0.3"
intel_tex_2 = "=0.5.0"
md-5 = { version = "=0.11.0", default-features = false }
proptest = { version = "=1.12.0", default-features = false, features = ["std"] }
quick-xml = "=0.42.0"
reqwest = { version = "=0.13.5", default-features = false, features = [
    "rustls",
] }
rmcp = { version = "=3.11.0", default-features = false, features = [
    "macros",
    "schemars",
    "server",
    "transport-streamable-http-server",
] }
schemars = "=1.2.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.11.1", default-features = false }
subband = { git = "https://github.com/chloridian/subband" }
tempfile = "3"
time = { version = "=0.3.55", features = ["formatting", "local-offset", "parsing"] }
tokio = { version = "1", features = [
    "io-util",
    "macros",
    "net",
    "rt-multi-thread",
    "sync",
    "time",
] }
toml_edit = "0.25"
tracing = "0.1"
tracing-appender = "=0.2.5"
tracing-subscriber = { version = "0.3", features = [
    "json",
    "time",
    "env-filter",
] }
tracing-tracy = { version = "=0.12.0", default-features = false, features = [
    "enable",
    "ondemand",
    "only-localhost",
] }
url = "2"
uuid = "1"
wgpu = { version = "=30.0.2", default-features = false, features = [
    "std",
    "vulkan",
    "wgsl",
] }

[workspace.lints.rust]
linker_messages = "allow"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(codspeed)"] }
unused_qualifications = "deny"

[workspace.lints.clippy]
absolute_paths = "deny"
allow_attributes = "deny"
complexity = { level = "deny", priority = -1 }
correctness = { level = "deny", priority = -1 }
dbg_macro = "deny"
indexing_slicing = "deny"
large_enum_variant = "allow"
perf = { level = "deny", priority = -1 }
redundant_clone = "deny"
suspicious = { level = "deny", priority = -1 }
todo = "deny"
too_many_arguments = "allow"
unimplemented = "deny"
unwrap_used = "deny"
upper_case_acronyms = "allow"

[profile.dev]
debug = "line-tables-only"

[profile.ci]
inherits = "dev"
incremental = false

[profile.release]
debug = 0
lto = "thin"

[profile.profiling]
inherits = "release"
debug = "line-tables-only"
lto = false
